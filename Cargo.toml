[package]
name = "rustro_macro"
version = "0.1.0"
edition = "2021"
description = "Lightweight Bee Swarm Simulator macro written in Rust"

[dependencies]
eframe = "0.30"
serde = { version = "1", features = ["derive"] }
toml = "0.8"

[dependencies.windows]
version = "0.58"
features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
]

[profile.release]
opt-level = 3
lto = true
strip = true
